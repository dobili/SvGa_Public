# Automatische Prüfungen bei jedem Push (Konzept Abschnitt 13 und 14).
# Veröffentlicht wird nur ein Stand, bei dem alle drei Teile grün sind:
#   1. Pipeline: Stil (ruff), Tests (pytest), eingecheckte Daten gegen die Schemas
#   2. App: Typen, Stil, Komponententests, Build mit Größenbudget, Cloudflare-Probelauf
#   3. Oberfläche: Playwright in Handygröße mit Chromium (Android) und WebKit (iPhone)
# Die Buchquellen sind privat und fehlen hier absichtlich (CLAUDE.md, Regel 2).
#
# Seit der Veröffentlichung (16.10.2026) wieder bei jedem Push und Pull Request: In einem
# öffentlichen Repository kosten die Läufe nichts. Davor lief die Prüfung nur von Hand, weil die
# freien Minuten des privaten Repositorys verbraucht waren.
name: Prüfen

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pruefen-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# onnxruntime-node (Maia unter Node, Messläufe) lädt beim Installieren auf Linux x64 die
# CUDA-Bibliotheken von GitHub nach; seit dem 18.11.2026 antwortet die Adresse mit 404, und
# `npm ci` brach ab. Die App braucht nur die CPU-Laufzeit aus dem npm-Paket.
env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  pipeline:
    name: Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Abhängigkeiten
        run: pip install -r pipeline/requirements.txt
      - name: Stil (ruff)
        run: |
          ruff check pipeline
          ruff format --check pipeline
      - name: Tests (pytest)
        run: python -m pytest -q
      - name: Daten gegen die Schemas
        run: python -m pipeline.pruefen.daten app/public/daten/de/a1

  app:
    name: App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Abhängigkeiten
        run: npm ci
      - name: Typen, Stil, Komponententests
        run: npm run pruefen
      # Alle Ink-Dialoge des Abenteuers übersetzen: vitest übersetzt die echten Dateien nicht,
      # und im Pipeline-Job fehlt inkjs (eine doppelte VAR blieb so am 17.11.2026 unbemerkt).
      - name: Ink-Dialoge übersetzen
        run: node ../pipeline/abenteuer/inkuebersetzung.cjs
      - name: Build mit Größenbudget
        run: npm run build
      - name: Cloudflare-Probelauf
        run: npx wrangler deploy --dry-run
      - uses: actions/upload-artifact@v5
        with:
          name: app-dist
          path: app/dist
          retention-days: 7
      # Fassung für die Leser (AP 17): ohne Aufgabenseite und ohne englische Vorschau. Nach dem
      # Hochladen gebaut, damit app-dist die Testfassung bleibt.
      - name: Fassung für die Leser
        run: npm run build:veroeffentlichung

  # In sechs Jobs nebeneinander: 826 Tests mit zwei Workern brauchten am Stück 45 bis 60 Minuten
  # (18.11.2026). Mit --shard allein lagen die langsamen Abenteuerdateien immer zusammen im ersten
  # Teil (19 von 22 Minuten); deshalb je Browser ein Job für das Abenteuer und zwei Hälften für den
  # Rest (PLAYWRIGHT_GRUPPE in playwright.config.ts). Jeder Job installiert nur seinen Browser,
  # baut selbst und lädt seinen eigenen Bericht hoch; fail-fast aus, damit ein Lauf alle Fehler zeigt.
  # Das Abenteuer in Chromium in zwei Hälften (20.11.2026): Auch ohne Maia im Hintergrund brauchten
  # seine 95 Tests 37,5 Minuten Testzeit, mit zwei Workern 19,5 Minuten am Stück (Lauf
  # 44782657320); WebKit überspringt mehr und blieb bei 10 Minuten.
  oberflaeche:
    name: Oberfläche (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Chromium, Abenteuer 1/2"
            kennung: chromium-abenteuer-1
            browser: chromium
            projekt: android-chromium
            gruppe: abenteuer
            teil: "1/2"
          - name: "Chromium, Abenteuer 2/2"
            kennung: chromium-abenteuer-2
            browser: chromium
            projekt: android-chromium
            gruppe: abenteuer
            teil: "2/2"
          - name: "Chromium 1/2"
            kennung: chromium-1
            browser: chromium
            projekt: android-chromium
            gruppe: ohne-abenteuer
            teil: "1/2"
          - name: "Chromium 2/2"
            kennung: chromium-2
            browser: chromium
            projekt: android-chromium
            gruppe: ohne-abenteuer
            teil: "2/2"
          - name: "WebKit, Abenteuer"
            kennung: webkit-abenteuer
            browser: webkit
            projekt: iphone-webkit
            gruppe: abenteuer
            teil: "1/1"
          - name: "WebKit 1/2"
            kennung: webkit-1
            browser: webkit
            projekt: iphone-webkit
            gruppe: ohne-abenteuer
            teil: "1/2"
          - name: "WebKit 2/2"
            kennung: webkit-2
            browser: webkit
            projekt: iphone-webkit
            gruppe: ohne-abenteuer
            teil: "2/2"
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Abhängigkeiten
        run: npm ci
      # Browser und Systempakete kommen aus dem Actions-Cache: „install --with-deps“ lud sie jedes
      # Mal über den langsamen Ubuntu-Spiegel (bis 6 Minuten, einmal Abbruch nach 12, Lauf
      # 44382063747, 18.11.2026). Schlüssel: Playwright-Version, Browser und für die Pakete das
      # Runner-Abbild (wechselt etwa wöchentlich, dann wird einmal neu geladen).
      - name: Schlüssel für die Caches
        id: schluessel
        run: |
          echo "playwright=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "system=${ImageOS:-unbekannt}" >> "$GITHUB_OUTPUT"
          echo "abbild=${ImageVersion:-unbekannt}" >> "$GITHUB_OUTPUT"
      - name: Browser aus dem Cache
        id: browsercache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.schluessel.outputs.playwright }}
      - name: Systempakete aus dem Cache
        id: paketcache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/systempakete
          key: systempakete-${{ steps.schluessel.outputs.system }}-${{ matrix.browser }}-${{ steps.schluessel.outputs.playwright }}-${{ steps.schluessel.outputs.abbild }}
          # Neues Abbild: zuerst die Pakete des vorigen versuchen (meist dieselben Fassungen).
          restore-keys: systempakete-${{ steps.schluessel.outputs.system }}-${{ matrix.browser }}-${{ steps.schluessel.outputs.playwright }}-
      - name: Browser
        # Zeitgrenze: In der Nacht zum 26.10.2026 hing dieser Schritt 21 Minuten; so bricht er ab.
        # Das Skript versucht die Systempakete übers Netz bis zu dreimal mit je 5 Minuten.
        timeout-minutes: 16
        run: |
          if [ "${{ steps.browsercache.outputs.cache-hit }}" != "true" ]; then
            npx playwright install ${{ matrix.browser }}
          fi
          bash skripte/ci-systempakete.sh ${{ matrix.browser }} "${{ runner.temp }}/systempakete"
      # Gleich speichern, nicht erst am Jobende: dort speichert actions/cache nur bei Erfolg.
      - name: Browser in den Cache
        if: steps.browsercache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsercache.outputs.cache-primary-key }}
      - name: Systempakete in den Cache
        if: steps.paketcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/systempakete
          key: ${{ steps.paketcache.outputs.cache-primary-key }}
      - name: Build
        run: npm run build
      - name: Playwright (${{ matrix.name }}, Handygröße)
        env:
          PLAYWRIGHT_GRUPPE: ${{ matrix.gruppe }}
        run: npm run test:e2e -- --project=${{ matrix.projekt }} --shard=${{ matrix.teil }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-bericht-${{ matrix.kennung }}
          path: |
            app/playwright-report
            app/test-results
          retention-days: 7
